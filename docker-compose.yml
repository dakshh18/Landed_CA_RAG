# Production stack for the EC2 box.
#   - backend : your prebuilt image, pulled from Docker Hub (not built here)
#   - caddy   : reverse proxy that terminates HTTPS (auto Let's Encrypt cert)
#
# All values come from the .env file sitting next to this file on the server.
# The database lives in Neon (cloud) — there is no Postgres container here.

services:
  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4o-mini}
      RETRIEVAL_K: ${RETRIEVAL_K:-8}
      REFUSE_THRESHOLD: ${REFUSE_THRESHOLD:-0.015}
      MAX_TOOL_CALLS: ${MAX_TOOL_CALLS:-4}
      CORS_ORIGIN: ${CORS_ORIGIN}
    expose:
      - "8080" # internal only; never published to the host

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
